name: Build

on:
  push:
    branches: [workbench-ui, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            solver: macos
            package: dist:mac
            artifact: release/*.dmg
          - name: Windows (x64)
            os: windows-latest
            solver: windows
            package: package:win
            artifact: release/*.exe
          - name: Linux (x64)
            # The oldest supported runner, so the app runs on older glibc.
            os: ubuntu-22.04
            solver: linux
            package: package:linux
            artifact: release/*.AppImage
          # The NVIDIA builds also carry a sprung-solve whose hypre runs on
          # NVIDIA GPUs, used where one works; the runners have none, so
          # their tests solve as the other builds do. CUDA code for Turing
          # (with PTX, which newer GPUs compile when they first load it),
          # Ampere, Ada and Blackwell.
          - name: Windows (x64, NVIDIA)
            os: windows-latest
            solver: windows-cuda
            cuda: 75;86-real;89-real;120-real
            package: package:win:nvidia
            artifact: release/*.exe
            variant: -nvidia
          - name: Linux (x64, NVIDIA)
            os: ubuntu-22.04
            solver: linux-cuda
            cuda: 75;86-real;89-real;120-real
            package: package:linux:nvidia
            artifact: release/*.AppImage
            variant: -nvidia
    env:
      # Unsigned builds: no certificate lookup, no publishing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # CalculiX 2.23 built from source on every platform, with threaded
      # SPOOLES and PARDISO (Apple Accelerate on macOS; on Windows and Linux,
      # Intel oneMKL's in sprung-solve, a separate program built beside it),
      # from a conda-forge environment.
      - name: Set up the solver build environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sprung-solver
          environment-file: native/calculix/solver-env-${{ matrix.solver }}.yml
          init-shell: none
          cache-environment: true

      # hypre for CUDA takes hours to compile on a runner: keep it between
      # runs, saved as soon as it is built. build-solver.py names each build
      # by its options, so a cache made with other options is not used.
      - name: Restore hypre for CUDA
        if: matrix.cuda
        uses: actions/cache/restore@v4
        with:
          path: .sprung-fea/hypre-cache
          key: hypre-${{ matrix.solver }}-${{ hashFiles(format('native/calculix/solver-env-{0}.yml', matrix.solver)) }}-${{ github.sha }}
          restore-keys: hypre-${{ matrix.solver }}-${{ hashFiles(format('native/calculix/solver-env-{0}.yml', matrix.solver)) }}-

      - name: Build CalculiX
        env:
          CUDA_ARCHITECTURES: ${{ matrix.cuda }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pefile; fi
          gpu=()
          if [ -n "$CUDA_ARCHITECTURES" ]; then gpu=(--cuda "$CUDA_ARCHITECTURES" --hypre-cache .sprung-fea/hypre-cache); fi
          python scripts/build-solver.py --prefix "$MAMBA_ROOT_PREFIX/envs/sprung-solver" "${gpu[@]}"

      - name: Save hypre for CUDA
        if: matrix.cuda && always()
        uses: actions/cache/save@v4
        with:
          path: .sprung-fea/hypre-cache
          key: hypre-${{ matrix.solver }}-${{ hashFiles(format('native/calculix/solver-env-{0}.yml', matrix.solver)) }}-${{ github.sha }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        # patchelf relocates the solver; Gmsh's library links to X11/GLU.
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1 libxfixes3

      - run: npm ci

      - name: Set up engine environment
        run: |
          npm run setup
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install pyinstaller==6.22.3

      - name: Compare the direct solvers
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m unittest -v tests.test_solvers

      - name: Package
        run: npm run ${{ matrix.package }}

      # The packaged app as shipped: its own sprung-solve and MKL, none
      # installed on the computer.
      - name: Solve with the packaged engine
        run: npm run test:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: sprung-fea-${{ runner.os }}${{ matrix.variant }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
