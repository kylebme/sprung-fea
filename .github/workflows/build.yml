name: Build

on:
  push:
    branches: [workbench-ui, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            solver: macos
            package: dist:mac
            artifact: release/*.dmg
          - name: Windows (x64)
            os: windows-latest
            solver: windows
            package: package:win
            artifact: release/*.exe
          - name: Linux (x64)
            # The oldest supported runner, so the app runs on older glibc.
            os: ubuntu-22.04
            solver: linux
            package: package:linux
            artifact: release/*.AppImage
    env:
      # Unsigned builds: no certificate lookup, no publishing.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      # CalculiX 2.23 built from source on every platform, with threaded
      # SPOOLES, PaStiX, and PARDISO (Apple Accelerate on macOS; an Intel MKL
      # the user installs elsewhere), from a conda-forge environment.
      - name: Set up the solver build environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: sprung-solver
          environment-file: native/calculix/solver-env-${{ matrix.solver }}.yml
          init-shell: none
          cache-environment: true

      - name: Build CalculiX
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python -m pip install pefile; fi
          python scripts/build-solver.py --prefix "$MAMBA_ROOT_PREFIX/envs/sprung-solver"

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        # patchelf relocates the solver; Gmsh's library links to X11/GLU.
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1 libxfixes3

      - run: npm ci

      - name: Set up engine environment
        run: |
          npm run setup
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pip install pyinstaller==6.22.3

      # MKL is not bundled. Install it beside the build, as a user would, so
      # that PARDISO is compared with the other direct solvers.
      - name: Install Intel MKL for the solver tests (Windows, Linux)
        if: runner.os != 'macOS'
        run: |
          "$MAMBA_EXE" create -y -q -n usermkl -c conda-forge mkl
          env="$MAMBA_ROOT_PREFIX/envs/usermkl"
          if [ "$RUNNER_OS" = Windows ]; then mkl="$env/Library/bin"; else mkl="$env/lib"; fi
          echo "SPRUNG_FEA_MKL=$mkl" >> "$GITHUB_ENV"

      - name: Compare the direct solvers
        env:
          # PaStiX's own progress in the solver log on Windows, where it
          # stops (temporary, for diagnosis).
          PASTIX_VERBOSE: ${{ runner.os == 'Windows' && '2' || '' }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m unittest -v tests.test_solvers

      - name: Package
        # The packaged app is tested as shipped: without MKL.
        run: |
          unset SPRUNG_FEA_MKL
          npm run ${{ matrix.package }}

      - name: Solve with the packaged engine
        run: |
          unset SPRUNG_FEA_MKL
          npm run test:packaged

      - uses: actions/upload-artifact@v4
        with:
          name: sprung-fea-${{ runner.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
