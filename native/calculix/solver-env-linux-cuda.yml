# Toolchain and libraries for scripts/build-solver.py --cuda on Linux x64,
# which builds hypre for NVIDIA GPUs (experimental):
#   micromamba create -n sprung-solver-cuda -f native/calculix/solver-env-linux-cuda.yml
# As solver-env-linux.yml, with CUDA 12.9, whose nvcc takes GCC 14 at most.
channels: [conda-forge]
dependencies:
  - gcc_linux-64 14.*
  - gxx_linux-64 14.*
  - gfortran_linux-64 14.*
  - arpack 3.9.*
  - libblas=*=*openblas
  - patchelf
  - mkl-static 2026.*
  - mkl-include 2026.*
  - cmake
  - cuda-version 12.9.*
  - cuda-nvcc
  - cuda-cudart-dev
  - cuda-profiler-api
  - libcusparse-dev
  - libcublas-dev
  - libcurand-dev
  - libcusolver-dev
