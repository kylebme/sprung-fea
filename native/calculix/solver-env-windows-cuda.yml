# Toolchain and libraries for scripts/build-solver.py --cuda on Windows x64,
# which also builds a sprung-solve whose hypre runs on NVIDIA GPUs:
#   micromamba create -n sprung-solver-cuda -f native/calculix/solver-env-windows-cuda.yml
# As solver-env-windows.yml, with CUDA 12.9. nvcc compiles hypre's host
# code with Visual Studio's C++ compiler, as sprung-solve is built.
channels: [conda-forge]
dependencies:
  - gcc_win-64
  - gfortran_win-64
  - arpack 3.9.*
  - libblas=*=*openblas
  - openblas
  - mkl-static 2026.*
  - mkl-include 2026.*
  - llvm-openmp
  - cmake
  - ninja
  - cuda-version 12.9.*
  - cuda-nvcc
  - cuda-cudart-dev
  # Linked statically: sprung-solve then needs only NVIDIA's driver.
  - cuda-cudart-static
  - cuda-profiler-api
  # hypre does not build for CUDA without cuSPARSE (which brings its JIT
  # linker, nvJitLink) or cuRAND.
  - libcusparse-dev
  - libcurand-dev
